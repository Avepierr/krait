<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>krait</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="titlebar">
  <div class="tb-left">
    <img id="brand-icon" src="../../assets/icon.png" alt="">
    <span class="tb-name">krait</span>
  </div>
  <div class="tb-drag"></div>
  <div class="tb-right">
    <button id="btn-changes" class="tb-btn" title="Changes (git diff)">&#9663; Changes</button>
    <button id="btn-terminal" class="tb-btn" title="Terminal">&gt;_</button>
    <button id="btn-settings" class="tb-btn" title="API keys">&#9881;</button>
    <button id="btn-min" class="tb-btn" title="Minimize">&#9472;</button>
    <button id="btn-max" class="tb-btn" title="Maximize">&#9634;</button>
    <button id="btn-close" class="tb-btn tb-close" title="Close">&#10005;</button>
  </div>
</header>

<div id="app">
  <aside id="sidebar">
    <button id="btn-new" class="new-btn">+ New chat</button>
    <div id="sessions"></div>

    <!-- profile block, bottom-left -->
    <div id="profile">
      <div class="p-avatar" id="p-avatar"></div>
      <div class="p-info">
        <div class="p-name">krait</div>
        <div class="p-sub" id="p-sub">free &middot; local keys</div>
      </div>
    </div>
  </aside>

  <main id="chat">
    <div id="messages"></div>

    <div id="composer">
      <div class="chips">
        <select id="model-select" title="Model"></select>
        <select id="mode-select" title="Mode">
          <option value="normal">Normal</option>
          <option value="plan">Plan</option>
          <option value="auto">Auto</option>
        </select>
        <select id="effort-select" title="Effort">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="max">Max</option>
          <option value="ultra">Ultracode</option>
        </select>
        <span class="spacer"></span>
        <span id="token-info" title="Tokens used this chat (from the API)">0 tok</span>
      </div>
      <div class="row">
        <textarea id="prompt" rows="1" placeholder="Ask anything..."></textarea>
        <button id="btn-send" class="round" title="Send (Enter)">&#10148;</button>
        <button id="btn-stop" class="round stop" title="Stop" style="display:none">&#9632;</button>
      </div>
    </div>
  </main>

  <aside id="terminal" class="hidden">
    <div id="term-out"></div>
    <input id="term-in" placeholder="$ command" spellcheck="false" autocomplete="off">
  </aside>

  <aside id="changes" class="hidden">
    <div class="drawer-head">Changes <button id="changes-close" class="tb-btn">&#10005;</button></div>
    <div id="changes-stat"></div>
    <div id="changes-diff"></div>
  </aside>
</div>

<!-- profile menu -->
<div id="profile-menu" class="hidden">
  <button class="pm-item" id="pm-settings">&#9881; Settings &amp; keys</button>
  <button class="pm-item" id="pm-plugins">&#9881;&#65039; Plugins</button>
  <button class="pm-item" id="pm-connectors">&#128268; Connectors</button>
  <div class="pm-sep"></div>
  <div class="pm-about">krait v0.4.0 &middot; your keys, your models</div>
</div>

<!-- key screen -->
<div id="key-screen">
  <div class="key-box">
    <button id="key-close" class="key-close" title="Close">&#10005;</button>
    <img class="key-icon" src="../../assets/icon.png" alt="">
    <h1>krait</h1>
    <p class="key-sub">Add your own API keys. Encrypted, stored on this PC only.</p>
    <form id="key-form">
      <label>Gemini <a href="https://aistudio.google.com/apikey" target="_blank">get free</a>
        <input id="k-gemini" type="password" placeholder="AIza...">
      </label>
      <label>OpenRouter <a href="https://openrouter.ai/keys" target="_blank">get free</a>
        <input id="k-openrouter" type="password" placeholder="sk-or...">
      </label>
      <label>NVIDIA <a href="https://build.nvidia.com" target="_blank">get free</a>
        <input id="k-nvidia" type="password" placeholder="nvapi-...">
      </label>
      <label>Anthropic <a href="https://console.anthropic.com" target="_blank">get key</a>
        <input id="k-anthropic" type="password" placeholder="sk-ant-...">
      </label>
      <div id="key-saved"></div>
      <button type="submit" class="key-start">Start coding &#10148;</button>
    </form>
  </div>
</div>

<!-- plugins screen -->
<div id="plugins-screen" class="overlay">
  <div class="overlay-box">
    <button class="key-close" id="plugins-close">&#10005;</button>
    <h1>Plugins</h1>
    <p class="key-sub">Built-in tools krait can use while coding.</p>
    <div id="plugins-list"></div>
  </div>
</div>

<!-- connectors screen -->
<div id="connectors-screen" class="overlay">
  <div class="overlay-box">
    <button class="key-close" id="connectors-close">&#10005;</button>
    <h1>Connectors</h1>
    <p class="key-sub">Link outside services to your workspace.</p>
    <div id="connectors-list"></div>
  </div>
</div>

<!-- toast -->
<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
