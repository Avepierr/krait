<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #e0e0e0;
    padding: 20px;
  }
  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  h1 {
    font-size: 2.2rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #7ee787;
    text-shadow: 0 0 12px rgba(126, 231, 135, 0.5);
  }
  .stats {
    display: flex;
    gap: 40px;
    font-size: 1.1rem;
  }
  .stats span {
    color: #7ee787;
    font-weight: bold;
  }
  canvas {
    border: 3px solid #2ea043;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(46, 160, 67, 0.4);
    background: #0d1117;
  }
  .controls {
    font-size: 0.9rem;
    color: #8b949e;
    text-align: center;
    line-height: 1.6;
  }
  button {
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover {
    background: #2ea043;
  }
  button:active {
    transform: scale(0.96);
  }
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 8px;
    text-align: center;
    gap: 12px;
  }
  .overlay h2 {
    font-size: 1.8rem;
    color: #f85149;
  }
  .canvas-container {
    position: relative;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>
  <div class="game-wrapper">
    <h1>Snake</h1>
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <div class="canvas-container">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="overlay hidden">
        <h2 id="overlayTitle">Game Over</h2>
        <p>Press SPACE or click the button</p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
    <div class="controls">
      Arrow Keys / WASD to move<br>
      Space to pause &middot; P to pause
    </div>
    <button id="startBtn">Start Game</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const restartBtn = document.getElementById('restartBtn');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  let snake, dir, nextDir, food, score, best = 0, speed, loopId, paused, running;

  function init() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 120;
    paused = false;
    running = true;
    scoreEl.textContent = '0';
    placeFood();
    overlay.classList.add('hidden');
    startBtn.textContent = 'Restart';
    clearInterval(loopId);
    loopId = setInterval(tick, speed);
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function tick() {
    if (!running || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
      }
      placeFood();
      // Speed up slightly
      if (speed > 60) {
        speed -= 2;
        clearInterval(loopId);
        loopId = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    // Background
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * GRID);
      ctx.lineTo(canvas.width, j * GRID);
      ctx.stroke();
    }

    // Food
    ctx.fillStyle = '#f85149';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // Snake
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      const g = Math.floor(231 - t * 80);
      ctx.fillStyle = `rgb(46, ${g}, 67)`;
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2);
    });

    // Eyes on head
    const h = snake[0];
    ctx.fillStyle = '#fff';
    const ex = h.x * GRID + GRID / 2;
    const ey = h.y * GRID + GRID / 2;
    ctx.beginPath();
    ctx.arc(ex - 3, ey - 3, 2, 0, Math.PI * 2);
    ctx.arc(ex + 3, ey - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function gameOver() {
    running = false;
    clearInterval(loopId);
    overlayTitle.textContent = 'Game Over';
    overlay.classList.remove('hidden');
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'p') {
      e.preventDefault();
      if (running) paused = !paused;
      return;
    }
    if (!running) return;
    switch (k) {
      case 'arrowup': case 'w': if (dir.y === 0) nextDir = { x: 0, y: -1 }; break;
      case 'arrowdown': case 's': if (dir.y === 0) nextDir = { x: 0, y: 1 }; break;
      case 'arrowleft': case 'a': if (dir.x === 0) nextDir = { x: -1, y: 0 }; break;
      case 'arrowright': case 'd': if (dir.x === 0) nextDir = { x: 1, y: 0 }; break;
    }
  });

  startBtn.addEventListener('click', init);
  restartBtn.addEventListener('click', init);

  // Initial draw (empty board)
  snake = [{ x: 10, y: 10 }];
  food = { x: 15, y: 10 };
  draw();
})();
</script>
</body>
</html>
