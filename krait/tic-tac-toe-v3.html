<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }
    h1 { margin-bottom: 1rem; font-weight: 300; letter-spacing: 2px; }
    .status { margin-bottom: 1.5rem; font-size: 1.2rem; min-height: 1.5em; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 4px;
      background: #16213e;
      border: 4px solid #16213e;
      border-radius: 8px;
    }
    .cell {
      background: #0f3460;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }
    .cell:hover { background: #1a4a7a; }
    .cell:active { transform: scale(0.98); }
    .cell.x { color: #e94560; }
    .cell.o { color: #00d9ff; }
    .cell.win { background: #1f6f4a; }
    .controls { margin-top: 1.5rem; display: flex; gap: 1rem; }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    .reset { background: #e94560; color: white; }
    .score { display: flex; gap: 2rem; margin-bottom: 1rem; font-size: 1.1rem; }
    .score span { display: flex; align-items: center; gap: 0.5rem; }
    .score .x-label { color: #e94560; }
    .score .o-label { color: #00d9ff; }
    @media (max-width: 400px) {
      .board { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
      .cell { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>TIC TAC TOE</h1>
  <div class="score">
    <span><span class="x-label">✕</span> Player X: <span id="scoreX">0</span></span>
    <span><span class="o-label">◯</span> Player O: <span id="scoreO">0</span></span>
  </div>
  <div class="status" id="status">Player X's turn</div>
  <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div>
  <div class="controls">
    <button class="reset" id="reset">New Game</button>
    <button id="resetScores">Reset Scores</button>
  </div>
  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const resetBtn = document.getElementById('reset');
    const resetScoresBtn = document.getElementById('resetScores');
    
    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0 };
    const winLines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    
    function render() {
      boardEl.innerHTML = '';
      board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ` ${val.toLowerCase()}` : '');
        cell.dataset.index = i;
        cell.textContent = val === 'X' ? '✕' : val === 'O' ? '◯' : '';
        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        cell.setAttribute('aria-label', `Cell ${i + 1}${val ? `, ${val}` : ', empty'}`);
        boardEl.appendChild(cell);
      });
    }
    
    function checkWin(b) {
      for (const [a, b1, c] of winLines) {
        if (b[a] && b[a] === b[b1] && b[a] === b[c]) return [a, b1, c];
      }
      return null;
    }
    
    function handleClick(i) {
      if (board[i] || gameOver) return;
      board[i] = current;
      render();
      
      const win = checkWin(board);
      if (win) {
        gameOver = true;
        scores[current]++;
        updateScores();
        win.forEach(idx => boardEl.children[idx].classList.add('win'));
        statusEl.textContent = `Player ${current} wins!`;
        return;
      }
      
      if (board.every(v => v)) {
        gameOver = true;
        statusEl.textContent = "It's a draw!";
        return;
      }
      
      current = current === 'X' ? 'O' : 'X';
      statusEl.textContent = `Player ${current}'s turn`;
    }
    
    function updateScores() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
    }
    
    function resetGame() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      statusEl.textContent = "Player X's turn";
      render();
    }
    
    function resetAll() {
      resetGame();
      scores = { X: 0, O: 0 };
      updateScores();
    }
    
    boardEl.addEventListener('click', e => {
      const cell = e.target.closest('.cell');
      if (cell) handleClick(+cell.dataset.index);
    });
    
    boardEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const cell = e.target.closest('.cell');
        if (cell) handleClick(+cell.dataset.index);
      }
    });
    
    resetBtn.addEventListener('click', resetGame);
    resetScoresBtn.addEventListener('click', resetAll);
    
    render();
  </script>
</body>
</html>
