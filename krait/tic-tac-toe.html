<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eaeaea;
    }
    h1 { margin-bottom: 1rem; font-size: 2.5rem; letter-spacing: 2px; }
    .status { font-size: 1.3rem; margin-bottom: 1.5rem; min-height: 1.8rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .cell {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .cell:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
    .cell.x { color: #ff6b6b; }
    .cell.o { color: #4ecdc4; }
    .cell.win { background: rgba(78, 205, 196, 0.2); border-color: #4ecdc4; box-shadow: 0 0 20px rgba(78, 205, 196, 0.3); }
    button {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
      color: #1a1a2e;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4); }
    button:active { transform: translateY(0); }
    .score { display: flex; gap: 2rem; font-size: 1.1rem; }
    .score span { display: flex; align-items: center; gap: 0.5rem; }
    .score .x-label { color: #ff6b6b; }
    .score .o-label { color: #4ecdc4; }
    @media (max-width: 400px) {
      .board { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
      .cell { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>TIC TAC TOE</h1>
  <div class="status" id="status">Player X's turn</div>
  <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div>
  <button id="reset">New Game</button>
  <div class="score">
    <span><span class="x-label">X:</span> <span id="scoreX">0</span></span>
    <span><span class="o-label">O:</span> <span id="scoreO">0</span></span>
    <span>Draws: <span id="scoreD">0</span></span>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDEl = document.getElementById('scoreD');

    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, D: 0 };
    const winLines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function render() {
      boardEl.innerHTML = '';
      board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
        cell.textContent = val || '';
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleMove(i));
        boardEl.appendChild(cell);
      });
      updateScores();
    }

    function handleMove(i) {
      if (board[i] || gameOver) return;
      board[i] = current;
      render();
      checkWinner();
    }

    function checkWinner() {
      for (const [a,b,c] of winLines) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          gameOver = true;
          scores[current]++;
          highlightWin([a,b,c]);
          statusEl.textContent = `Player ${current} wins! 🎉`;
          updateScores();
          return;
        }
      }
      if (!board.includes(null)) {
        gameOver = true;
        scores.D++;
        statusEl.textContent = "It's a draw! 🤝";
        updateScores();
        return;
      }
      current = current === 'X' ? 'O' : 'X';
      statusEl.textContent = `Player ${current}'s turn`;
    }

    function highlightWin(indices) {
      indices.forEach(i => {
        const cell = boardEl.children[i];
        if (cell) cell.classList.add('win');
      });
    }

    function updateScores() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDEl.textContent = scores.D;
    }

    function reset() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      statusEl.textContent = "Player X's turn";
      render();
    }

    resetBtn.addEventListener('click', reset);
    render();
  </script>
</body>
</html>
