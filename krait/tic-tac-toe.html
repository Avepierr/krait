<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; font-size: 2rem; letter-spacing: 2px; }
  #status {
    font-size: 1.2rem;
    margin-bottom: 16px;
    min-height: 1.5em;
    text-align: center;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
  }
  .cell {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    font-size: 3rem;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
  }
  .cell:hover:not(.taken) { background: rgba(255,255,255,0.25); transform: scale(1.03); }
  .cell.x { color: #ffd166; }
  .cell.o { color: #06d6a0; }
  .cell.win { background: rgba(255, 209, 102, 0.45); border-color: #ffd166; }
  .cell.taken { cursor: default; }
  button {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #ffd166;
    color: #1e3c72;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }
  button:hover { background: #ffe29a; transform: translateY(-2px); }
  .scoreboard {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 1rem;
  }
  .scoreboard span { font-weight: bold; }
  @media (max-width: 400px) {
    .board { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
  }
</style>
</head>
<body>
  <h1>TIC TAC TOE</h1>
  <div class="scoreboard">
    <div>X wins: <span id="scoreX">0</span></div>
    <div>Draws: <span id="scoreD">0</span></div>
    <div>O wins: <span id="scoreO">0</span></div>
  </div>
  <div id="status">Player X's turn</div>
  <div class="board" id="board"></div>
  <button id="reset">New Game</button>

<script>
(function () {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');
  const scoreX = document.getElementById('scoreX');
  const scoreO = document.getElementById('scoreO');
  const scoreD = document.getElementById('scoreD');

  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],   // rows
    [0,3,6],[1,4,7],[2,5,8],   // columns
    [0,4,8],[2,4,6]            // diagonals
  ];

  let cells, current, gameOver, scores = { X: 0, O: 0, D: 0 };

  function init() {
    cells = Array(9).fill('');
    current = 'X';
    gameOver = false;
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.dataset.index = i;
      c.addEventListener('click', onCellClick);
      boardEl.appendChild(c);
    }
    statusEl.textContent = "Player X's turn";
  }

  function onCellClick(e) {
    if (gameOver) return;
    const i = +e.currentTarget.dataset.index;
    if (cells[i]) return;

    cells[i] = current;
    e.currentTarget.textContent = current;
    e.currentTarget.classList.add('taken', current.toLowerCase());

    const line = getWinLine();
    if (line) {
      gameOver = true;
      line.forEach(idx => boardEl.children[idx].classList.add('win'));
      statusEl.textContent = `Player ${current} wins!`;
      scores[current]++;
      updateScores();
      return;
    }
    if (cells.every(c => c)) {
      gameOver = true;
      statusEl.textContent = "It's a draw!";
      scores.D++;
      updateScores();
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = `Player ${current}'s turn`;
  }

  function getWinLine() {
    return LINES.find(([a, b, c]) =>
      cells[a] && cells[a] === cells[b] && cells[a] === cells[c]
    );
  }

  function updateScores() {
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    scoreD.textContent = scores.D;
  }

  resetBtn.addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
