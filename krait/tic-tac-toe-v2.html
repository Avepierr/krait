<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }
    h1 { margin-bottom: 1rem; font-weight: 300; letter-spacing: 2px; }
    .status { margin-bottom: 1.5rem; font-size: 1.2rem; min-height: 1.5em; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 300;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .cell:hover:not(.taken) { background: #0f3460; border-color: #e94560; }
    .cell.x { color: #e94560; }
    .cell.o { color: #00d9ff; }
    .cell.win { background: #1a3c2e; border-color: #27ae60; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #27ae6080; } 50% { box-shadow: 0 0 0 8px #27ae6000; } }
    button {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #d6344e; }
    .score { display: flex; gap: 2rem; margin-bottom: 1rem; font-size: 1.1rem; }
    .score span { background: #16213e; padding: 0.5rem 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>TIC TAC TOE</h1>
  <div class="score">
    <span>X: <span id="sx">0</span></span>
    <span>O: <span id="so">0</span></span>
    <span>Draws: <span id="sd">0</span></span>
  </div>
  <div class="status" id="status">X's turn</div>
  <div class="board" id="board"></div>
  <button id="reset">New Game</button>
  <script>
    const board = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');
    const sx = document.getElementById('sx'), so = document.getElementById('so'), sd = document.getElementById('sd');
    let cells = [], current = 'X', gameOver = false;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let scores = { X: 0, O: 0, D: 0 };
    function init() {
      board.innerHTML = '';
      cells = [];
      current = 'X';
      gameOver = false;
      statusEl.textContent = "X's turn";
      for (let i = 0; i < 9; i++) {
        const c = document.createElement('div');
        c.className = 'cell';
        c.dataset.i = i;
        c.addEventListener('click', () => move(i));
        board.appendChild(c);
        cells.push(c);
      }
    }
    function move(i) {
      if (gameOver || cells[i].classList.contains('taken')) return;
      cells[i].textContent = current;
      cells[i].classList.add(current.toLowerCase(), 'taken');
      if (checkWin(current)) {
        gameOver = true;
        statusEl.textContent = current + ' wins!';
        scores[current]++;
        updateScores();
        wins.forEach(c => {
          if (c.every(idx => cells[idx].textContent === current)) {
            c.forEach(idx => cells[idx].classList.add('win'));
          }
        });
      } else if (cells.every(c => c.classList.contains('taken'))) {
        gameOver = true;
        statusEl.textContent = "It's a draw";
        scores.D++;
        updateScores();
      } else {
        current = current === 'X' ? 'O' : 'X';
        statusEl.textContent = current + "'s turn";
      }
    }
    function checkWin(p) {
      return wins.some(c => c.every(idx => cells[idx].textContent === p));
    }
    function updateScores() {
      sx.textContent = scores.X;
      so.textContent = scores.O;
      sd.textContent = scores.D;
    }
    resetBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
