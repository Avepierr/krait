<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eaeaea;
      padding: 2rem 1rem;
    }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin-bottom: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .score-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
    .score-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
    .score-value { font-size: 1.5rem; font-weight: 700; }
    .score-x .score-value { color: #ff4757; }
    .score-o .score-value { color: #2ed573; }
    .score-draw .score-value { color: #ffa502; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(90vw, 360px);
      aspect-ratio: 1;
    }
    .cell {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      outline: none;
    }
    .cell:hover:not(.filled):not(.disabled) {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }
    .cell:focus-visible {
      box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.4);
    }
    .cell.x { color: #ff4757; }
    .cell.o { color: #2ed573; }
    .cell.filled { cursor: default; }
    .cell.disabled { cursor: not-allowed; opacity: 0.5; }
    .cell.win {
      animation: pulse 1s ease-in-out infinite;
      background: rgba(46, 213, 115, 0.15);
      border-color: #2ed573;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(46, 213, 115, 0); }
    }
    .status {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      min-height: 1.5em;
      text-align: center;
    }
    .status.x-turn { color: #ff4757; }
    .status.o-turn { color: #2ed573; }
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-new { background: linear-gradient(135deg, #2ed573, #1eae6b); color: #0a0a0a; }
    .btn-new:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46, 213, 115, 0.3); }
    .btn-reset { background: rgba(255,255,255,0.05); color: #eaeaea; border: 1px solid rgba(255,255,255,0.15); }
    .btn-reset:hover { background: rgba(255,71,87,0.15); border-color: #ff4757; color: #ff4757; }
    button:focus-visible { outline: 2px solid #2ed573; outline-offset: 2px; }
    @media (max-width: 400px) {
      .scoreboard { gap: 1rem; padding: 0.75rem 1rem; }
      .score-value { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="scoreboard" role="region" aria-label="Scoreboard">
    <div class="score-item score-x">
      <span class="score-label">X Wins</span>
      <span class="score-value" id="scoreX">0</span>
    </div>
    <div class="score-item score-draw">
      <span class="score-label">Draws</span>
      <span class="score-value" id="scoreDraw">0</span>
    </div>
    <div class="score-item score-o">
      <span class="score-label">O Wins</span>
      <span class="score-value" id="scoreO">0</span>
    </div>
  </div>
  <div class="board" role="grid" aria-label="Tic tac toe board">
    <button class="cell" role="gridcell" aria-label="Row 1, Column 1" data-index="0"></button>
    <button class="cell" role="gridcell" aria-label="Row 1, Column 2" data-index="1"></button>
    <button class="cell" role="gridcell" aria-label="Row 1, Column 3" data-index="2"></button>
    <button class="cell" role="gridcell" aria-label="Row 2, Column 1" data-index="3"></button>
    <button class="cell" role="gridcell" aria-label="Row 2, Column 2" data-index="4"></button>
    <button class="cell" role="gridcell" aria-label="Row 2, Column 3" data-index="5"></button>
    <button class="cell" role="gridcell" aria-label="Row 3, Column 1" data-index="6"></button>
    <button class="cell" role="gridcell" aria-label="Row 3, Column 2" data-index="7"></button>
    <button class="cell" role="gridcell" aria-label="Row 3, Column 3" data-index="8"></button>
  </div>
  <div class="status" id="status" aria-live="polite">X's turn</div>
  <div class="controls">
    <button class="btn-new" id="btnNew">New Game</button>
    <button class="btn-reset" id="btnReset">Reset Scores</button>
  </div>
  <script>
    (() => {
      const cells = document.querySelectorAll('.cell');
      const statusEl = document.getElementById('status');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDrawEl = document.getElementById('scoreDraw');
      const btnNew = document.getElementById('btnNew');
      const btnReset = document.getElementById('btnReset');

      const WIN_COMBOS = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];

      let board = Array(9).fill(null);
      let current = 'X';
      let gameOver = false;
      let scores = { X: 0, O: 0, draw: 0 };

      function loadScores() {
        const saved = localStorage.getItem('ttt_scores');
        if (saved) { scores = JSON.parse(saved); updateScoreUI(); }
      }
      function saveScores() { localStorage.setItem('ttt_scores', JSON.stringify(scores)); }
      function updateScoreUI() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
        scoreDrawEl.textContent = scores.draw;
      }
      function setStatus(msg, cls) {
        statusEl.textContent = msg;
        statusEl.className = 'status ' + (cls || '');
      }
      function checkWin(b) {
        for (const [a,b1,c] of WIN_COMBOS) {
          if (b[a] && b[a] === b[b1] && b[a] === b[c]) return [a,b1,c];
        }
        return null;
      }
      function checkDraw(b) { return b.every(v => v !== null); }
      function handleWin(winCells, player) {
        winCells.forEach(i => cells[i].classList.add('win'));
        scores[player]++;
        saveScores();
        updateScoreUI();
        setStatus(`${player} wins!`, `${player.toLowerCase()}-turn`);
        gameOver = true;
        disableBoard();
      }
      function handleDraw() {
        scores.draw++;
        saveScores();
        updateScoreUI();
        setStatus(`Draw!`, '');
        gameOver = true;
        disableBoard();
      }
      function disableBoard() { cells.forEach(c => c.classList.add('disabled')); }
      function enableBoard() { cells.forEach(c => c.classList.remove('disabled')); }
      function clearBoard() {
        board.fill(null);
        cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
        current = 'X';
        gameOver = false;
        enableBoard();
        setStatus("X's turn", 'x-turn');
      }
      function resetScores() {
        scores = { X: 0, O: 0, draw: 0 };
        saveScores();
        updateScoreUI();
      }
      function makeMove(index) {
        if (gameOver || board[index]) return;
        board[index] = current;
        const cell = cells[index];
        cell.textContent = current;
        cell.classList.add(current.toLowerCase(), 'filled');
        const win = checkWin(board);
        if (win) { handleWin(win, current); return; }
        if (checkDraw(board)) { handleDraw(); return; }
        current = current === 'X' ? 'O' : 'X';
        setStatus(`${current}'s turn`, `${current.toLowerCase()}-turn`);
      }
      cells.forEach((cell, i) => {
        cell.addEventListener('click', () => makeMove(i));
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); makeMove(i); }
        });
      });
      btnNew.addEventListener('click', clearBoard);
      btnReset.addEventListener('click', resetScores);
      loadScores();
      clearBoard();
    })();
  </script>
</body>
</html>
