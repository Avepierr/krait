<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic Tac Toe — krait</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --accent: #38bdf8;
    --accent2: #f472b6;
    --cell: rgba(255,255,255,0.06);
    --text: #e2e8f0;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #831843 0%, transparent 50%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    letter-spacing: 2px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { text-align: center; font-size: 0.8rem; opacity: 0.6; margin-bottom: 18px; }

  .modes { display: flex; gap: 8px; margin-bottom: 16px; }
  .modes button {
    flex: 1; padding: 10px 0; border: 1px solid rgba(255,255,255,0.15);
    background: transparent; color: var(--text); border-radius: 12px;
    cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all .2s;
  }
  .modes button.active {
    background: linear-gradient(135deg, var(--accent), #6366f1);
    border-color: transparent; color: #fff;
    box-shadow: 0 6px 20px rgba(56,189,248,0.35);
  }

  .status {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 28px;
    margin-bottom: 14px;
  }
  .status.turn-x { color: var(--accent); }
  .status.turn-o { color: var(--accent2); }
  .status.win { color: #4ade80; }
  .status.draw { color: #fbbf24; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--cell);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    font-size: 3rem;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
    user-select: none;
  }
  .cell:hover:not(.taken) { background: rgba(255,255,255,0.14); transform: scale(1.02); }
  .cell.x { color: var(--accent); text-shadow: 0 0 18px rgba(56,189,248,0.7); }
  .cell.o { color: var(--accent2); text-shadow: 0 0 18px rgba(244,114,182,0.7); }
  .cell.win { background: rgba(74,222,128,0.25); border-color: #4ade80; animation: pop .4s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
  @keyframes place { 0%{transform:scale(0.4); opacity:0} 100%{transform:scale(1); opacity:1} }
  .cell.placed { animation: place .18s ease-out; }

  .scores { display: flex; justify-content: space-around; margin-bottom: 16px; }
  .score { text-align: center; }
  .score .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
  .score .value { font-size: 1.6rem; font-weight: 800; }

  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1; padding: 12px; border-radius: 12px; border: none;
    font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: transform .1s;
  }
  .actions button:active { transform: scale(0.97); }
  #restart { background: linear-gradient(135deg, var(--accent), #6366f1); color: #fff; }
  #reset  { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
  .footer { text-align: center; margin-top: 16px; font-size: 0.7rem; opacity: 0.4; }
</style>
</head>
<body>
<div class="card">
  <h1>TIC TAC TOE</h1>
  <p class="subtitle">Built by krait · Avepier</p>

  <div class="modes">
    <button id="mode-pvp" class="active">2 Players</button>
    <button id="mode-ai">vs Computer</button>
  </div>

  <div id="status" class="status turn-x">X's turn</div>

  <div class="board" id="board"></div>

  <div class="scores">
    <div class="score"><div class="label">X wins</div><div class="value" id="sx">0</div></div>
    <div class="score"><div class="label">Draws</div><div class="value" id="sd">0</div></div>
    <div class="score"><div class="label">O wins</div><div class="value" id="so">0</div></div>
  </div>

  <div class="actions">
    <button id="restart">New Round</button>
    <button id="reset">Reset All</button>
  </div>
  <div class="footer">Click a square to place your mark.</div>
</div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const sx = document.getElementById('sx'), so = document.getElementById('so'), sd = document.getElementById('sd');

  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, current, gameOver, mode, scores = {X:0, O:0, D:0};

  function init() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    mode = 'pvp';
    render();
    updateStatus();
  }

  function render() {
    boardEl.innerHTML = '';
    board.forEach((v, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (v ? ' taken ' + v.toLowerCase() : '');
      if (v) c.textContent = v;
      c.addEventListener('click', () => move(i));
      boardEl.appendChild(c);
    });
  }

  function updateStatus(msg) {
    statusEl.className = 'status';
    if (msg) { statusEl.textContent = msg; return; }
    if (gameOver) return;
    statusEl.classList.add(current === 'X' ? 'turn-x' : 'turn-o');
    statusEl.textContent = mode === 'ai' && current === 'O' ? "Computer is thinking..." : current + "'s turn";
  }

  function move(i) {
    if (gameOver || board[i]) return;
    if (mode === 'ai' && current === 'O') return;
    place(i);
  }

  function place(i) {
    board[i] = current;
    render();
    const cells = boardEl.children;
    cells[i].classList.add('placed');
    const win = winner();
    if (win) {
      gameOver = true;
      if (win === 'D') {
        scores.D++; sd.textContent = scores.D;
        updateStatus("It's a draw!");
        statusEl.classList.add('draw');
      } else {
        scores[win]++;
        (win === 'X' ? sx : so).textContent = scores[win];
        WINS.find(w => w.every(idx => board[idx] === win)).forEach(idx => cells[idx].classList.add('win'));
        updateStatus(win + ' wins! 🎉');
        statusEl.classList.add('win');
      }
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    updateStatus();
    if (mode === 'ai' && current === 'O') setTimeout(aiMove, 500);
  }

  function winner() {
    for (const w of WINS) {
      const [a,b,c] = w;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
    }
    return board.every(v => v) ? 'D' : null;
  }

  // Minimax AI (unbeatable)
  function aiMove() {
    let best = -Infinity, move = 0;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'O';
        let s = minimax(board, 0, false);
        board[i] = null;
        if (s > best) { best = s; move = i; }
      }
    }
    place(move);
  }

  function minimax(b, depth, isMax) {
    const w = winner();
    if (w === 'O') return 10 - depth;
    if (w === 'X') return depth - 10;
    if (w === 'D') return 0;
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) if (!b[i]) {
        b[i] = 'O'; best = Math.max(best, minimax(b, depth+1, false)); b[i] = null;
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) if (!b[i]) {
        b[i] = 'X'; best = Math.min(best, minimax(b, depth+1, true)); b[i] = null;
      }
      return best;
    }
  }

  document.getElementById('restart').addEventListener('click', init);
  document.getElementById('reset').addEventListener('click', () => {
    scores = {X:0,O:0,D:0}; sx.textContent = so.textContent = sd.textContent = 0; init();
  });
  document.getElementById('mode-pvp').addEventListener('click', function(){
    mode = 'pvp'; this.classList.add('active');
    document.getElementById('mode-ai').classList.remove('active'); init();
  });
  document.getElementById('mode-ai').addEventListener('click', function(){
    mode = 'ai'; this.classList.add('active');
    document.getElementById('mode-pvp').classList.remove('active'); init();
  });

  init();
})();
</script>
</body>
</html>
